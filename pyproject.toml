[project]
name = "pubmed-extraction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MaricelPS", email = "maricelpzschmit@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "duckdb>=1.5.6",
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
px = "pubmed_extraction.cli:app"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
